name: Build Windows Binary

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Dependencies
        run: |
          go mod tidy

      - name: Build Standalone Executable
        run: |
          go build -ldflags="-s -w -H windowsgui" -o sahand-ssh-proxy.exe main.go

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sahand-SSH-Proxy-Windows-x64
          path: sahand-ssh-proxy.exe
          retention-days: 14
